# Integración continua: valida backend, chatbot y frontend en cada push y PR.
# NO despliega: publicar en Render u otro proveedor sigue siendo un paso manual
# y autorizado. Los secretos de esta CI son valores efímeros de prueba.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Configuración de Django
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "false"
      - name: Migraciones al día (sin cambios pendientes)
        run: python manage.py makemigrations --check --dry-run
      - name: Migraciones aplicables desde cero
        run: python manage.py migrate --noinput
      - name: Pruebas
        run: pytest -q

  chatbot:
    name: Servicio de chatbot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHATBOT_SECRET_KEY: ci-only-not-a-secret
    defaults:
      run:
        working-directory: services/chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/chatbot/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py check
      - run: pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos de rutas de Next
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Sintaxis del widget público
        working-directory: backend/widget/static_src
        run: node --check widget.js

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, chatbot, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build de las imágenes (sin publicar)
        run: |
          docker build -t ci/backend ./backend
          docker build -t ci/chatbot ./services/chatbot
          docker build -t ci/frontend ./frontend
